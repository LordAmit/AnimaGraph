[package]
name = "animagraph"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["svg"] }
image = "0.25.10"
resvg = { version = "0.45.1", default-features = false }
rfd = "0.18.0"
qcms = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-foundation", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
winit = "0.30"

# The animator does per-pixel work; keep debug builds fast enough to use.
# Debug info is kept to line numbers for the app and left out for libraries:
# full debug info made the build cache grow to many gigabytes.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Smaller, faster app for sharing: no debug data, link-time optimization.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
